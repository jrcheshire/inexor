[project]
name = "inexor"
description = "Exactly reversible, compressed-state differentiable N-body: a JAX particle-mesh code with fixed-point integer phase space and a bit-exact-replay adjoint."
authors = [{ name = "James Cheshire", email = "cheshire@caltech.edu" }]
maintainers = [{ name = "James Cheshire", email = "cheshire@caltech.edu" }]
requires-python = ">=3.11"
readme = "README.md"
license = "BSD-3-Clause"
# SINGLE SOURCE OF TRUTH for the version; src/inexor/__init__.py reads it back
# via importlib.metadata. Declared statically ON PURPOSE: pixi must read this
# package's metadata to solve foreign-platform envs (the linux-aarch64 gpu env
# for Vista), and `dynamic = ["version"]` forces it to execute hatchling with an
# interpreter it cannot have for a platform it cannot run -- the solve dies with
# "no compatible Python interpreter". Do not reintroduce dynamic version.
version = "0.0.1.dev0"

dependencies = [
  "jax>=0.4.30",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inexor"]

# ---------------------------------------------------------------------------
# pixi config. `pixi.lock` is committed; co-commit it on any dependency change.
# default env = CPU jax (osx-arm64 dev + linux CI); gpu env = CUDA 12 on BOTH
# linux-64 (deneb / generic x86 CUDA) and linux-aarch64 (TACC Vista
# Grace-Hopper). The aarch64 platform landed at M2 S4 -- see docs/roadmap.md.
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[tool.pixi.dependencies]
python = ">=3.11"
numpy = "*"
scipy = "*"          # host-side float64 background integrals (precision island)
matplotlib = "*"     # diagnostics / M0 probe plots
pytest = "*"
pytest-xdist = "*"
ruff = "*"

[tool.pixi.pypi-dependencies]
inexor = { path = ".", editable = true }

[tool.pixi.feature.jax.dependencies]
jax = "*"            # conda-forge jaxlib is CPU-only in the default env

# GPU env: CUDA on linux-64 (deneb RTX 3050 6 GB / generic CUDA node) AND
# linux-aarch64 (TACC Vista GH200, xcat pattern -- conda-forge ships an
# aarch64 CUDA jaxlib, so this is a committed-lock install with no native
# solve on Vista). The two platforms share one spec set; cuda = "12" is a
# driver FLOOR, satisfied by deneb's 13.3 and Vista's 12.x alike.
# NOTE: pixi 0.72 warns that [system-requirements] is deprecated for inline
# platform tables, but 0.72 does not yet PARSE the inline form (errors:
# "expected a string, found table") -- keep this form until pixi accepts the
# replacement, then migrate.
[tool.pixi.feature.gpu]
platforms = ["linux-64", "linux-aarch64"]
[tool.pixi.feature.gpu.system-requirements]
cuda = "12"
[tool.pixi.feature.gpu.dependencies]
jax = "*"
jaxlib = { version = "*", build = "*cuda*" }
cuda-version = "12.*"

# Pallas-GPU env (V1/G1 ONLY): conda-forge's CUDA jaxlib is built WITHOUT the
# Pallas GPU lowering ("Cannot lower pallas_call on platform: gpu", deneb job
# 28, 2026-07-15) -- Google's pypi jax[cuda12] wheels carry it. Isolated env
# so the proven conda-forge `gpu` env (tests, Vista aarch64) stays untouched.
# Version pinned to the gpu env's jax so G1's XLA-vs-pallas comparison is
# same-jax.
[tool.pixi.feature.gpu-pallas]
platforms = ["linux-64"]
[tool.pixi.feature.gpu-pallas.pypi-dependencies]
jax = { version = "==0.10.2", extras = ["cuda12"] }

# Parity env: CAMB (+ pyccl cross-check) for the M1 parity harness ONLY --
# the default env stays jax+numpy+scipy. mbody and DISCO-DJ are never
# installed here; the harness exchanges npz files across their own pixi envs
# (cross-process parity, plan tender-stargazing-map S5).
[tool.pixi.feature.parity]
platforms = ["osx-arm64", "linux-64"]
[tool.pixi.feature.parity.dependencies]
camb = "*"
pyccl = "*"
# camb 1.6.5's BBN-YHe setter chokes on numpy 2.5 + scipy 1.18 (1-element
# array refuses scalar conversion at model.py:687); mbody's proven combo is
# numpy 2.4 + scipy 1.17 -- pin this env to that class until camb catches up.
numpy = "<2.5"
scipy = "<1.18"

[tool.pixi.environments]
default = ["jax"]
gpu = ["gpu"]
gpu-pallas = ["gpu-pallas"]
parity = ["jax", "parity"]

[tool.pixi.tasks]
# `-n auto` (pytest-xdist) parallelizes across cores; OMP_NUM_THREADS=1 pins one
# thread per worker -- JAX-CPU otherwise grabs every core per process and
# oversubscribes (same rationale + measured win as sfbfs/jht). env is per-task.
test = { cmd = "pytest -n auto", env = { OMP_NUM_THREADS = "1" } }
test-fast = { cmd = "pytest -m 'not slow' -n auto", env = { OMP_NUM_THREADS = "1" } }
# `detflag` tests assert BIT equality and need XLA deterministic ops on GPU (the
# f32 scatter-add is otherwise nondeterministic -- M2 S4, deneb jobs 14/15).
# XLA_FLAGS is process-wide and read at backend init, so they need their OWN
# process: `test` skips them visibly on GPU (tests/conftest.py), `test-det` runs
# them. env is per-task, so the flag cannot leak into `test` -- which is exactly
# why this is depends-on and not `test && test-det` in one cmd string.
test-det = { cmd = "pytest -m detflag -n auto", env = { OMP_NUM_THREADS = "1", XLA_FLAGS = "--xla_gpu_deterministic_ops=true" } }
test-all = { depends-on = ["test", "test-det"] }
lint = "ruff check"
format = "ruff format"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: heavy validation / oracle-parity test; run by the full suite, not the fast gate",
  "detflag: asserts BIT equality of a float quantity; needs XLA deterministic ops on GPU (the f32 scatter-add is nondeterministic -- M2 S4). Run by `test-det` in its own process; `test` skips it on GPU. See tests/conftest.py",
]
