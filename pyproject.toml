[project]
name = "inexor"
description = "A memory-lean particle-mesh N-body engine in JAX: compressed fixed-point particle state, a two-level force and streamed initial conditions, sized to fit large realizations on one node."
authors = [{ name = "James Cheshire", email = "cheshire@caltech.edu" }]
maintainers = [{ name = "James Cheshire", email = "cheshire@caltech.edu" }]
requires-python = ">=3.11"
readme = "README.md"
license = "BSD-3-Clause"
# Single source of truth for the version; src/inexor/__init__.py reads it back via
# importlib.metadata. Static on purpose: pixi reads this metadata to solve foreign-platform
# envs (linux-aarch64 for Vista), and `dynamic = ["version"]` would make it run hatchling
# with an interpreter it cannot have ("no compatible Python interpreter").
version = "0.0.1.dev0"

dependencies = [
  "jax>=0.4.30",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inexor"]

# ---------------------------------------------------------------------------
# pixi config. `pixi.lock` is committed; co-commit it on any dependency change.
# default env = CPU jax (osx-arm64 dev + linux CI); gpu env = CUDA 12 on both linux-64
# (generic x86 CUDA) and linux-aarch64 (TACC Vista Grace-Hopper).
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[tool.pixi.dependencies]
python = ">=3.11"
numpy = "*"
scipy = "*"          # host-side float64 background integrals (precision island)
matplotlib = "*"     # diagnostic plots
pytest = "*"
pytest-xdist = "*"
ruff = "*"

[tool.pixi.pypi-dependencies]
inexor = { path = ".", editable = true }

[tool.pixi.feature.jax.dependencies]
jax = "*"            # conda-forge jaxlib is CPU-only in the default env

# GPU env: CUDA on linux-64 and linux-aarch64 (TACC Vista); conda-forge ships an aarch64
# CUDA jaxlib, so Vista installs from the committed lock with no native solve. One spec
# set for both; cuda = "12" is a driver floor (CUDA 12.x and 13.x drivers satisfy it).
# pixi 0.72 warns [system-requirements] is deprecated for inline platform tables but cannot
# parse the inline form yet ("expected a string, found table"); migrate once it can.
[tool.pixi.feature.gpu]
platforms = ["linux-64", "linux-aarch64"]
[tool.pixi.feature.gpu.system-requirements]
cuda = "12"
[tool.pixi.feature.gpu.dependencies]
jax = "*"
jaxlib = { version = "*", build = "*cuda*" }
cuda-version = "12.*"
# Host MPI between nodes. conda-forge ships no external-MPI placeholder for linux-aarch64, so
# the env carries MPICH; on a cluster the job puts an MPICH-ABI module's libmpi (Vista:
# mvapich-plus) ahead of it. Imported only by multi-node code; single-node runs never load it.
mpi4py = "*"
mpich = "*"

[tool.pixi.environments]
default = ["jax"]
gpu = ["gpu"]

[tool.pixi.tasks]
# `-n auto` (pytest-xdist) parallelizes across cores; OMP_NUM_THREADS=1 pins one thread
# per worker, since JAX-CPU otherwise grabs every core per process and oversubscribes.
test = { cmd = "pytest -n auto", env = { OMP_NUM_THREADS = "1" } }
test-fast = { cmd = "pytest -m 'not slow' -n auto", env = { OMP_NUM_THREADS = "1" } }
# `detflag` tests assert bit equality and need XLA deterministic ops on GPU (the f32
# scatter-add is otherwise nondeterministic). XLA_FLAGS is process-wide and read at backend
# init, so they run in their own process: `test` skips them visibly on GPU
# (tests/conftest.py), `test-det` runs them. env is per-task, so `test-all` uses depends-on
# rather than `test && test-det` to keep the flag out of `test`.
test-det = { cmd = "pytest -m detflag -n auto", env = { OMP_NUM_THREADS = "1", XLA_FLAGS = "--xla_gpu_deterministic_ops=true" } }
test-all = { depends-on = ["test", "test-det"] }
# The across-ranks gates (tests/test_ranks_*.py) on 8 emulated devices with a single-threaded
# XLA-CPU pool: on macOS the threaded pool makes a jitted FFT's bytes vary run to run, so
# `test` skips them there.
test-ranks = { cmd = "pytest -n auto tests/test_ranks_coarse.py tests/test_ranks_tile.py tests/test_ranks_migrate.py tests/test_ranks_run.py", env = { OMP_NUM_THREADS = "1", XLA_FLAGS = "--xla_cpu_multi_thread_eigen=false --xla_force_host_platform_device_count=8" } }
lint = "ruff check"
format = "ruff format"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# the repo root on sys.path, so bare `pytest` (the pixi tasks) resolves `from tests.x import`
pythonpath = ["."]
markers = [
  "slow: heavy validation / oracle-parity test; run by the full suite, not the fast gate",
  "detflag: asserts BIT equality of a float quantity; needs XLA deterministic ops on GPU (the f32 scatter-add is nondeterministic -- M2 S4). Run by `test-det` in its own process; `test` skips it on GPU. See tests/conftest.py",
]
